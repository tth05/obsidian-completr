name: Build and release

on:
    push:
        tags:
            - "*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  # `bun lint` is only available in canary builds for now
                  bun-version: canary
            - run: bun install --frozen-lockfile
            - run: bun run check
            - run: bun test
            - run: bun run build
            - name: Create draft release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "${{ github.ref_name }}" main.js manifest.json styles.css --draft --title "${{ github.ref_name }}" --generate-notes
